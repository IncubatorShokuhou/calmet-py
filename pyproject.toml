[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pycalmet"
version = "0.2.0"
description = "NumPy implementation of the CALMET preprocessing and diagnostic workflow"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["CALMET", "CALPUFF", "WRF", "meteorology", "downscaling"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [
  "numpy>=1.23,<3",
  "scipy>=1.11,<2",
  "netCDF4>=1.6,<2",
  "pyproj>=3.4,<4",
  "rasterio>=1.4,<2",
  "shapely>=2,<3",
  "tifffile>=2023.7,<2027",
]

[project.optional-dependencies]
test = [
  "pytest>=7",
  "tomli>=2; python_version < '3.11'",
]

[project.urls]
Repository = "https://github.com/IncubatorShokuhou/py-calmet"
Issues = "https://github.com/IncubatorShokuhou/py-calmet/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
