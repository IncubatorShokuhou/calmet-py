[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pycalmet"
version = "0.2.0"
description = "NumPy CALMET workflow with an optional JAX backend"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["CALMET", "CALPUFF", "WRF", "meteorology", "downscaling"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [
  "numpy>=1.23,<3",
  "scipy>=1.11,<2",
  "netCDF4>=1.6,<2",
  "pyproj>=3.4,<4",
  "rasterio>=1.4,<2",
  "shapely>=2,<3",
  "tifffile>=2023.7,<2027",
]

[project.optional-dependencies]
test = [
  "mypy>=1.11,<2",
  "pytest>=7",
  "tomli>=2; python_version < '3.11'",
]
# Linux x86_64 and aarch64 receive the CUDA 12 plugin wheels (driver >= 525).
# Every other platform receives the portable JAX wheel. Selecting JAX at
# runtime is separate: the default backend stays NumPy until PYCALMET_BACKEND
# or pycalmet.set_backend("jax").
gpu = [
  "jax[cuda12]>=0.4.31; platform_system == 'Linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')",
  "jax>=0.4.31; platform_system != 'Linux' or (platform_machine != 'x86_64' and platform_machine != 'aarch64')",
]

[project.urls]
Repository = "https://github.com/IncubatorShokuhou/py-calmet"
Issues = "https://github.com/IncubatorShokuhou/py-calmet/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pycalmet = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
mypy_path = "src"
files = ["src/pycalmet", "tools", "examples"]
exclude = ['^src/pycalmet/legacy/_compat/']
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_any_generics = true
no_implicit_optional = true
warn_return_any = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
